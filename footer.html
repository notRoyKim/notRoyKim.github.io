<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Header & Footer Example</title>
  <style>
    body {
      margin: 0;
    }
    header {
      height: 50px;
      width: 100%;
      background-color: #f5f5f5;
      display: flex;
      align-items: center;
      padding-left: 10px;
      box-sizing: border-box;
    }
    .menu-container {
      width: 50px;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .hamburger {
      width: 30px;
      height: 30px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .hamburger span {
      display: block;
      height: 4px;
      background: #333;
      border-radius: 2px;
    }

    footer {
      height: 80px;
      width: 100%;
      background-color: #ddd;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .footer-content {
      width: 70%;
      text-align: right;
    }
    .footer-content a {
      margin-left: 15px;
      font-size: 14px;
      color: #333;
      text-decoration: none;
    }
    .footer-content a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <header>
    <div class="menu-container">
      <div class="hamburger">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>
  </header>

  <footer>
    <div class="footer-content">
      <a href="#">Link1</a>
      <a href="#">Link2</a>
      <a href="#">Link3</a>
      <a href="#">Link4</a>
      <a href="#">Link5</a>
    </div>
  </footer>
</body>
</html>
