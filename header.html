<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Header</title>
  <style>
    body {
      margin: 0;
    }
    header {
      height: 70px;
      width: 100%;
      background-color: #f5f5f5;
      display: flex;
      align-items: center;
      padding-left: 10px;
      box-sizing: border-box;
    }
    .menu-container {
      width: 50px;
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .hamburger {
      width: 25px;
      height: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .hamburger span {
      display: block;
      height: 4px;
      background: #333;
      border-radius: 2px;
    }

    /* LNB */
  .lnb {
    position: fixed;
    top: 70px; /* header 밑 */
    left: -220px; /* 기본 화면 밖 */
    width: 220px;
    height: calc(100% - 50px); 
    background: #eee;
    display: flex;
    flex-direction: column;
    padding: 10px;
    box-sizing: border-box;
    transition: right 0.3s ease;
    z-index: 100;
  }
  .lnb.active {
    left: 0; /* 슬라이드 인 */
  }
  .lnb div {
    padding: 12px;
    margin-bottom: 8px;
    background: #ddd;
    border-radius: 4px;
    cursor: pointer;
    text-align: center;
  }
  .lnb div:hover {
    background: #ccc;
  }
  </style>
</head>
<body>
  <header>
    <div class="menu-container">
      <div class="hamburger" id="menuBtn">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>

    <nav class="lnb" id="lnb">
      <a href="/Alby.html"><div>하드모드 알비 상급</div></a>
      <a href="/Ciar.html"><div>하드모드 알비 상급</div></a>
      <a href="/Rundal.html"><div>하드모드 알비 상급</div></a>
      <a href="/Illusion.html"><div>되살아난 허상</div></a>
      <a href="/Feth.html"><div>페스 피아다</div></a>
      <a href="/Seven.html"><div>일곱번의 악몽</div></a>
      <a href="/Abyssal.html"><div>깨어난 심연의 군주</div></a>
    </nav>
  
<script>
  document.addEventListener("DOMContentLoaded", function() {
    const menuBtn = document.getElementById("menuBtn");
    const lnb = document.getElementById("lnb");
    const contents = document.getElementById("contents"); // cont1.html에서 main 영역

    menuBtn.addEventListener("click", () => {
      lnb.classList.toggle("active");
      if (contents) {
        contents.classList.toggle("shrink"); // margin-right 220px
      }
    });
  });
</script>
    
  </header>
</body>
</html>
